[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-lab"
version = "0.1.0"
description = "Grafy i ich zastosowania - laboratorium (AGH), zestawy 1-6"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
# networkx wolno uzywac tylko do wizualizacji / porownan w testach,
# same algorytmy z tresci zestawow MUSZA byc napisane samodzielnie.
dev = ["pytest>=7", "networkx>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
